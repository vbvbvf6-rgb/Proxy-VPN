kind = "mobile"
previewPath = "/"
title = "VPN Proxy"
description = "Android-first VPN profile manager for importing, organizing, and connecting to common VLESS, VMess, Trojan, and Shadowsocks VPN links and subscriptions."
version = "1.0.0"
id = "artifacts/vpn-proxy"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 20748

[services.development]
run = "pnpm --filter @workspace/vpn-proxy run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vpn-proxy", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/vpn-proxy", "run", "serve" ]

[services.env]
PORT = "20748"
BASE_PATH = "/"
